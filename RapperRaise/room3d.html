<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PS5風 3Dマイルーム・プロトタイプ (NYC Loft Engine)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #090d16;
            color: #f8fafc;
            touch-action: none;
        }
        /* PS5風のすりガラスHUDスタイル */
        .ps5-glass {
            background: rgba(15, 23, 42, 0.62);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        .ps5-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #f1f5f9;
            transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .ps5-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }
        .ps5-btn:active {
            transform: translateY(1px) scale(0.98);
        }
        .ps5-btn-active {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.92), rgba(245, 158, 11, 0.92));
            border-color: #fef3c7;
            color: #0f172a;
            font-weight: 800;
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.45);
        }
        .ps5-btn-cyan {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.9), rgba(2, 132, 199, 0.9));
            border-color: #bae6fd;
            color: #082f49;
            font-weight: 800;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
        }
        /* ピグDNAを受け継ぐ3D空間追従吹き出し */
        .speech-bubble-3d {
            position: absolute;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 8px 14px;
            color: #0f172a;
            font-weight: 700;
            font-size: 13px;
            line-height: 1.4;
            max-width: 240px;
            word-wrap: break-word;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            transform: translate(-50%, -100%);
            pointer-events: none;
            animation: bubblePop 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 30;
        }
        .speech-bubble-3d::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 7px 6px 0;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.94) transparent transparent;
        }
        @keyframes bubblePop {
            0% { opacity: 0; transform: translate(-50%, -85%) scale(0.75); }
            100% { opacity: 1; transform: translate(-50%, -100%) scale(1); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="w-screen h-screen relative overflow-hidden">

    <!-- WebGL 3D レンダリングキャンバス -->
    <div id="canvasContainer" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- 吹き出し・3D空間ラベルオーバーレイ -->
    <div id="overlayLayer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- 上部 PS5スタイル・フローティングヘッダー -->
    <header class="relative z-20 flex flex-wrap items-center justify-between gap-2 p-3 sm:p-4 pointer-events-none">
        <!-- ルームタイトル＆ライティングステータス -->
        <div class="pointer-events-auto ps5-glass rounded-2xl px-4 py-2 flex items-center gap-3">
            <div class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24] animate-pulse"></div>
            <div>
                <div class="text-[10px] tracking-widest uppercase font-bold text-amber-300/90">NYC LOFT • PBR 3D ENGINE</div>
                <div class="text-sm sm:text-base font-extrabold tracking-tight text-white">ブルックリン・ロフトのへや</div>
            </div>
        </div>

        <!-- 右上コントロール群 -->
        <div class="pointer-events-auto flex flex-wrap items-center gap-1.5 sm:gap-2">
            <!-- 環境ライティング切替 (PS5 Golden Hour / Rainy Night / Morning) -->
            <div class="ps5-glass rounded-full p-1 flex items-center gap-1">
                <button data-light="sunset" class="light-btn ps5-btn ps5-btn-active rounded-full px-3 py-1.5 text-xs font-bold">🌇 夕暮れ</button>
                <button data-light="rain" class="light-btn ps5-btn rounded-full px-3 py-1.5 text-xs font-bold">🌧️ 雨の夜</button>
                <button data-light="morning" class="light-btn ps5-btn rounded-full px-3 py-1.5 text-xs font-bold">☀️ 朝陽</button>
            </div>

            <!-- カメラアングル切替 -->
            <div class="ps5-glass rounded-full p-1 hidden md:flex items-center gap-1">
                <button data-cam="iso" class="cam-btn ps5-btn ps5-btn-cyan rounded-full px-3 py-1.5 text-xs font-bold">クォーター</button>
                <button data-cam="window" class="cam-btn ps5-btn rounded-full px-3 py-1.5 text-xs font-bold">窓辺夕景</button>
                <button data-cam="cinema" class="cam-btn ps5-btn rounded-full px-3 py-1.5 text-xs font-bold">シネマ</button>

            <!-- Lo-Fi BGM サウンドトグル -->
            <button id="btnAudio" class="ps5-glass ps5-btn rounded-full px-3.5 py-2 text-xs font-bold flex items-center gap-1.5" title="環境Lo-Fiシンセ再生">
                <span id="audioIcon">🔇</span>

            <!-- Devデバッグ -->
            <button id="btnDebug" class="ps5-glass ps5-btn rounded-full px-3.5 py-2 text-xs font-bold flex items-center gap-1.5">
                <span class="text-sky-400">&lt;/&gt;</span>

            <!-- もようがえ -->
            <button id="btnEditMode" class="ps5-glass ps5-btn-active rounded-full px-4 py-2 text-xs font-extrabold flex items-center gap-1.5">
                <span>🛋️</span>

    <!-- 開発者向け 3Dエンジン・インスペクター -->
    <aside id="debugPanel" class="hidden relative z-20 mx-3 sm:mx-4 self-start ps5-glass rounded-2xl p-3.5 text-xs max-w-xs pointer-events-auto border-sky-400/40">
        <div class="font-extrabold text-sky-300 border-b border-white/15 pb-1.5 mb-2 flex items-center justify-between">
            <span>🎮 PS5-Style 3D Engine Specs</span>
            <span class="text-[10px] bg-sky-500/30 border border-sky-400/50 px-1.5 py-0.5 rounded text-sky-200">ACES Filmic</span>
        </div>
        <div class="space-y-1 font-mono text-[11px] text-slate-200">
            <div>Hover Tile  : <span id="dbgHover" class="text-amber-300">(-, -)</span></div>
            <div>Avatar Grid : <span id="dbgAvatar" class="text-emerald-300">(5, 5)</span></div>
            <div>Draw Calls  : <span id="dbgCalls" class="text-sky-300">0</span> / Tris: <span id="dbgTris" class="text-sky-300">0</span></div>
            <div>Shadow Map  : <span class="text-purple-300">2048×2048 PCFSoft</span></div>
            <div class="text-[10px] text-slate-400 pt-1.5 leading-relaxed border-t border-white/10 mt-1.5">
                • プロシージャルPBR (Albedo/Bump/Roughness)<br>
                • ボリューメトリック・ゴッドレイ (Additive Shader)<br>
                • 右ドラッグ回転 / ホイールズーム / 家具クリック連動
            </div>
        </div>
    </aside>

    <!-- 模様替えフローティング操作バー -->
    <div id="editControls" class="hidden relative z-20 mx-auto mb-2 pointer-events-auto ps5-glass rounded-full px-4 py-2 flex items-center gap-2">

        <button id="btnRotateItem" class="ps5-btn rounded-full px-3 py-1 text-xs font-bold">↻ 回転 (R)</button>

        <!-- アクション＆エモートポップアップ -->

            <button data-action="sit" class="action-trigger ps5-btn rounded-xl px-3 py-1.5 text-xs font-bold">🪑 座る</button>

            <button data-action="jump" class="action-trigger ps5-btn rounded-xl px-3 py-1.5 text-xs font-bold">⚡ ジャンプ</button>

            <button data-emote="♪" class="emote-trigger ps5-btn rounded-xl px-2.5 py-1.5 text-sm font-bold text-amber-300">♪</button>
            <button data-emote="！" class="emote-trigger ps5-btn rounded-xl px-2.5 py-1.5 text-sm font-bold text-sky-300">！</button>
            <button data-emote="♥" class="emote-trigger ps5-btn rounded-xl px-2.5 py-1.5 text-sm font-bold text-rose-400">♥</button>

        </div>

        <!-- 通常プレイ時：チャット＆アクションバー -->
        <div id="normalBottomBar" class="pointer-events-auto w-full max-w-2xl ps5-glass rounded-full p-1.5 sm:p-2 flex items-center gap-2">
            <button id="btnToggleActions" class="ps5-btn rounded-full px-3.5 py-2 text-xs sm:text-sm font-bold shrink-0 flex items-center gap-1.5">
                <span>🕺</span>
                <span class="hidden sm:inline">アクション</span>
            </button>

            <form id="chatForm" class="flex-1 flex items-center gap-1.5 min-w-0">
                <input
                    id="chatInput"
                    type="text"
                    maxlength="45"
                    placeholder="メッセージを入力... (ソファやレコード機もクリックできます)"
                    class="w-full bg-white/10 border border-white/15 focus:border-amber-400 focus:bg-white/15 rounded-full px-4 py-1.5 text-xs sm:text-sm text-white placeholder-slate-400 outline-none transition"
                />
                <button type="submit" class="ps5-btn-active rounded-full px-4 sm:px-5 py-2 text-xs sm:text-sm shrink-0">
                    発言
                </button>
            </form>
        </div>

        <!-- 模様替えモード時：家具インベントリ -->
        <div id="furnitureInventoryBar" class="hidden pointer-events-auto w-full max-w-3xl ps5-glass rounded-2xl p-2.5">
            <div id="inventoryList" class="flex items-center gap-2 overflow-x-auto no-scrollbar"></div>
        </div>
    </footer>

<script>
/**
 * ============================================================================
 * PS5-Style 3D Loft Room Engine (Marvel's Spider-Man / Miles Morales Aesthetic)
 * ============================================================================
 * 技術アーキテクチャ:
 * 1. Three.js PBR Pipeline:
 *    - ACESFilmicToneMapping + sRGBEncoding による映画的ダイナミックレンジ
 *    - 2048x2048 PCFSoftShadowMap による窓枠のリアルな落ち影
 *    - HTML5 Canvas プロシージャル生成テクスチャ (Albedo + Bump + Roughness)
 *      ・ヘリンボーン＆木目フローリング（目地と木目のスペキュラ反射差）
 *      ・ブルックリン風赤レンガ壁（モルタル目地バンプマップ）
 *      ・ファブリック織り目（ソファ・ラグ）
 * 2. ボリューメトリック・ライティング & 環境プリセット:
 *    - 大きなインダストリアル窓から差し込む半透明ライトシャフト（ゴッドレイ）
 *    - 夕暮れ (Golden Hour) / 雨のNYC夜 (Rainy Night + 窓の雨粒アニメーション) / 朝陽 (Morning)
 * 3. ピグ風インタラクション:
 *    - 10x10 グリッド上の A* 経路探索移動
 *    - ソファクリックで自動移動＆着席、レコードプレイヤー/TVクリックで音楽・映像反応
 */

const container = document.getElementById('canvasContainer');
const overlayLayer = document.getElementById('overlayLayer');

// --- グリッド・ワールド定数 ---
const GRID_SIZE = 10;
const TILE_SIZE = 1.0; // 1タイル = 1.0m スケール
const ROOM_SIZE = GRID_SIZE * TILE_SIZE;
const HALF_ROOM = ROOM_SIZE / 2;
const WALL_HEIGHT = 4.4;

// --- ゲーム状態 ---
const state = {
    editMode: false,
    debugMode: false,
    deleteMode: false,
    selectedCatalogId: 'sofa_ivory',
    placementRotation: 0,
    hoverTile: null,
    lightingPreset: 'sunset', // 'sunset' | 'rain' | 'morning'
    cameraPreset: 'iso',      // 'iso' | 'window' | 'cinema'
    musicPlaying: false,
    furnitures: [],
    chatBubble: null,
    emotePop: null
};

// --- 家具カタログ定義 ---
const FURNITURE_CATALOG = [
    { id: 'rug_woven', name: '織り目エリアラグ', category: 'floor_decor', w: 4, d: 3, solid: false, sittable: false, color: '#cbd5e1' },
    { id: 'sofa_ivory', name: 'ロフトソファ', category: 'furniture', w: 3, d: 1, solid: false, sittable: true, seatY: 0.44, color: '#f8fafc' },
    { id: 'table_oak', name: 'オークローテーブル', category: 'furniture', w: 2, d: 1, solid: true, sittable: false, color: '#b45309' },
    { id: 'media_tv', name: 'TV＆オーディオ台', category: 'furniture', w: 3, d: 1, solid: true, sittable: false, interactive: 'tv', color: '#1e293b' },
    { id: 'turntable_desk', name: 'DJレコードデスク', category: 'furniture', w: 2, d: 1, solid: true, sittable: false, interactive: 'music', color: '#78350f' },
    { id: 'plant_monstera', name: 'モンステラ鉢植え', category: 'furniture', w: 1, d: 1, solid: true, sittable: false, color: '#15803d' },
    { id: 'lamp_arc', name: 'フロアランプ', category: 'furniture', w: 1, d: 1, solid: true, sittable: false, interactive: 'light', color: '#fbbf24' },
    { id: 'cushion_knit', name: 'ニットプフ', category: 'furniture', w: 1, d: 1, solid: false, sittable: true, seatY: 0.28, color: '#38bdf8' }
];

// ============================================================================
// Three.js シーン・レンダラー・カメラ初期化
// ============================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b101d);
scene.fog = new THREE.FogExp2(0x131b2e, 0.022);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

// --- カメラ軌道（Orbit）制御ステート ---
const camControl = {
    yaw: Math.PI * 0.25,       // 水平角度
    pitch: 0.56,              // 俯瞰角度
    distance: 14.5,           // ターゲットからの距離
    target: new THREE.Vector3(0, 0.9, 0),
    desiredYaw: Math.PI * 0.25,
    desiredPitch: 0.56,
    desiredDistance: 14.5,
    desiredTarget: new THREE.Vector3(0, 0.9, 0)
};

function setCameraPreset(preset) {
    state.cameraPreset = preset;
    if (preset === 'iso') {
        camControl.desiredYaw = Math.PI * 0.25;
        camControl.desiredPitch = 0.56;
        camControl.desiredDistance = 14.5;
        camControl.desiredTarget.set(0, 0.9, 0);
    } else if (preset === 'window') {
        camControl.desiredYaw = Math.PI * 0.36;
        camControl.desiredPitch = 0.32;
        camControl.desiredDistance = 10.2;
        camControl.desiredTarget.set(-0.6, 1.3, -1.2);
    } else if (preset === 'cinema') {
        camControl.desiredYaw = Math.PI * 0.18;
        camControl.desiredPitch = 0.42;
        camControl.desiredDistance = 11.5;
        camControl.desiredTarget.set(0.2, 1.0, 0.2);
    }
}

// ============================================================================
// プロシージャル PBR テクスチャジェネレーター (高精細木材・赤レンガ・ファブリック)
// ============================================================================
function createWoodFloorTextures() {
    const size = 1024;
    const albedoCanvas = document.createElement('canvas');
    const bumpCanvas = document.createElement('canvas');
    const roughCanvas = document.createElement('canvas');
    albedoCanvas.width = bumpCanvas.width = roughCanvas.width = size;
    albedoCanvas.height = bumpCanvas.height = roughCanvas.height = size;

    const aCtx = albedoCanvas.getContext('2d');
    const bCtx = bumpCanvas.getContext('2d');
    const rCtx = roughCanvas.getContext('2d');

    // ベース背景
    aCtx.fillStyle = '#6b4226';
    aCtx.fillRect(0, 0, size, size);
    bCtx.fillStyle = '#808080';
    bCtx.fillRect(0, 0, size, size);
    rCtx.fillStyle = '#666666'; // 適度なワックス光沢
    rCtx.fillRect(0, 0, size, size);

    const rows = 16;
    const cols = 4;
    const plankH = size / rows;
    const plankW = size / cols;

    for (let r = 0; r < rows; r++) {
        const offsetX = (r % 2) * (plankW * 0.5);
        for (let c = -1; c <= cols; c++) {
            const x = c * plankW + offsetX;
            const y = r * plankH;

            // 板ごとの微妙な色調差
            const tone = (Math.sin(r * 12.9898 + c * 78.233) * 43758.5453) % 1;
            const shade = Math.floor((tone - 0.5) * 24);
            const red = Math.min(255, Math.max(40, 118 + shade));
            const green = Math.min(255, Math.max(25, 72 + Math.floor(shade * 0.7)));
            const blue = Math.min(255, Math.max(15, 42 + Math.floor(shade * 0.5)));

            aCtx.fillStyle = `rgb(${red},${green},${blue})`;
            aCtx.fillRect(x + 1, y + 1, plankW - 2, plankH - 2);

            // 木目繊維ライン
            for (let g = 0; g < 18; g++) {
                const gy = y + 2 + Math.random() * (plankH - 4);
                aCtx.strokeStyle = `rgba(35, 18, 8, ${0.06 + Math.random() * 0.08})`;
                aCtx.lineWidth = 1 + Math.random() * 1.5;
                aCtx.beginPath();
                aCtx.moveTo(x + 2, gy);
                aCtx.bezierCurveTo(
                    x + plankW * 0.33, gy + (Math.random() - 0.5) * 4,
                    x + plankW * 0.66, gy + (Math.random() - 0.5) * 4,
                    x + plankW - 2, gy
                );
                aCtx.stroke();

                bCtx.strokeStyle = 'rgba(60,60,60,0.25)';
                bCtx.stroke();
            }

            // 板の継ぎ目（深い溝）
            aCtx.strokeStyle = '#2d180c';
            aCtx.lineWidth = 2;
            aCtx.strokeRect(x, y, plankW, plankH);

            bCtx.strokeStyle = '#181818';
            bCtx.lineWidth = 3;
            bCtx.strokeRect(x, y, plankW, plankH);

            // 板ごとのラフネス差（リアルな反射ムラ）
            const roughVal = 75 + Math.floor(Math.abs(tone) * 55);
            rCtx.fillStyle = `rgb(${roughVal},${roughVal},${roughVal})`;
            rCtx.fillRect(x + 2, y + 2, plankW - 4, plankH - 4);
        }
    }

    const map = new THREE.CanvasTexture(albedoCanvas);
    const bumpMap = new THREE.CanvasTexture(bumpCanvas);
    const roughnessMap = new THREE.CanvasTexture(roughCanvas);
    [map, bumpMap, roughnessMap].forEach(t => {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(3, 3);
    });
    map.encoding = THREE.sRGBEncoding;

    return { map, bumpMap, roughnessMap };
}

function createBrickWallTextures() {
    const size = 1024;
    const aCanvas = document.createElement('canvas');
    const bCanvas = document.createElement('canvas');
    aCanvas.width = bCanvas.width = size;
    aCanvas.height = bCanvas.height = size;

    const aCtx = aCanvas.getContext('2d');
    const bCtx = bCanvas.getContext('2d');

    // モルタル目地ベース
    aCtx.fillStyle = '#9ca3af';
    aCtx.fillRect(0, 0, size, size);
    bCtx.fillStyle = '#222222';
    bCtx.fillRect(0, 0, size, size);

    const rows = 16;
    const cols = 8;
    const bh = size / rows;
    const bw = size / cols;
    const mortar = 5;

    const brickColors = ['#8c3b2b', '#9e4733', '#783124', '#a8523c', '#6e2c20'];

    for (let r = 0; r < rows; r++) {
        const shift = (r % 2) * (bw * 0.5);
        for (let c = -1; c <= cols; c++) {
            const x = c * bw + shift + mortar * 0.5;
            const y = r * bh + mortar * 0.5;
            const w = bw - mortar;
            const h = bh - mortar;

            const col = brickColors[Math.abs((r * 7 + c * 13)) % brickColors.length];
            aCtx.fillStyle = col;
            aCtx.fillRect(x, y, w, h);

            // レンガ表面の凹凸ノイズ
            for (let n = 0; n < 35; n++) {
                aCtx.fillStyle = Math.random() > 0.5 ? 'rgba(255,220,200,0.07)' : 'rgba(20,10,5,0.12)';
                aCtx.fillRect(x + Math.random() * w, y + Math.random() * h, 4, 3);
            }

            bCtx.fillStyle = '#d4d4d4';
            bCtx.fillRect(x + 1, y + 1, w - 2, h - 2);
        }
    }

    const map = new THREE.CanvasTexture(aCanvas);
    const bumpMap = new THREE.CanvasTexture(bCanvas);
    [map, bumpMap].forEach(t => {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(2.5, 1.4);
    });
    map.encoding = THREE.sRGBEncoding;
    return { map, bumpMap };
}

function createFabricBumpTexture() {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, size, size);

    for (let y = 0; y < size; y += 4) {
        for (let x = 0; x < size; x += 4) {
            ctx.fillStyle = ((x + y) / 4) % 2 === 0 ? '#a8a8a8' : '#585858';
            ctx.fillRect(x, y, 3, 3);
        }
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(8, 8);
    return tex;
}

function applyLightingPreset(preset) {
    state.lightingPreset = preset;
    if (preset === 'sunset') {
        scene.background.setHex(0x0b101d);
        scene.fog.color.setHex(0x16192b);
        sunLight.color.setHex(0xffa947);
        sunLight.intensity = 2.9;
        hemiLight.color.setHex(0x7dd3fc);
        hemiLight.groundColor.setHex(0x78350f);
        hemiLight.intensity = 0.65;
        lampPointLight.intensity = 1.4;
        sunBeamGroup.visible = true;
        dustMat.opacity = 0.68;
        rainMat.opacity = 0.0;
        renderer.toneMappingExposure = 1.18;
    } else if (preset === 'rain') {
        scene.background.setHex(0x050811);
        scene.fog.color.setHex(0x070d19);
        sunLight.color.setHex(0x38bdf8); // 月明かり＆ネオンの青白い外光
        sunLight.intensity = 0.95;
        hemiLight.color.setHex(0x1e3a8a);
        hemiLight.groundColor.setHex(0x1e1b4b);
        hemiLight.intensity = 0.55;
        lampPointLight.intensity = 2.4; // 室内ランプの温かみが際立つコントラスト
        sunBeamGroup.visible = false;
        dustMat.opacity = 0.15;
        rainMat.opacity = 0.65;
        renderer.toneMappingExposure = 1.12;
    } else if (preset === 'morning') {
        scene.background.setHex(0x1e293b);
        scene.fog.color.setHex(0x334155);
        sunLight.color.setHex(0xfffbeb);
        sunLight.intensity = 2.6;
        hemiLight.color.setHex(0xe0f2fe);
        hemiLight.groundColor.setHex(0x92400e);
        hemiLight.intensity = 0.95;
        lampPointLight.intensity = 0.4;
        sunBeamGroup.visible = true;
        dustMat.opacity = 0.4;
        rainMat.opacity = 0.0;
        renderer.toneMappingExposure = 1.24;
    }
}

function gridToWorld(gx, gy, w = 1, d = 1) {
    return {

        z: -HALF_ROOM + (gy + d * 0.5) * TILE_SIZE
    };

function worldToGrid(wx, wz) {
    const gx = Math.floor((wx + HALF_ROOM) / TILE_SIZE);
    const gy = Math.floor((wz + HALF_ROOM) / TILE_SIZE);
    if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {

}

// ============================================================================
// 家具配置・衝突判定・A*経路探索ロジック (ピグ共通コア)
// ============================================================================
function getFurnitureDimensions(def, rotation) {
    return rotation % 2 === 0 ? { w: def.w, d: def.d } : { w: def.d, d: def.w };
}

function canPlaceFurniture(catalogId, gx, gy, rotation) {
    const def = FURNITURE_CATALOG.find(f => f.id === catalogId);
    if (!def) return false;
    const { w, d } = getFurnitureDimensions(def, rotation);
    if (gx < 0 || gy < 0 || gx + w > GRID_SIZE || gy + d > GRID_SIZE) return false;

    for (let dx = 0; dx < w; dx++) {
        for (let dy = 0; dy < d; dy++) {
            const tx = gx + dx;
            const ty = gy + dy;
            const conflict = state.furnitures.some(ex => {
                const exDef = FURNITURE_CATALOG.find(c => c.id === ex.catalogId);
                if (exDef.category !== def.category) return false;
                return tx >= ex.gx && tx < ex.gx + ex.w && ty >= ex.gy && ty < ex.gy + ex.d;
            });
            if (conflict) return false;
        }
    }
    return true;
}

function placeFurniture(catalogId, gx, gy, rotation) {
    if (!canPlaceFurniture(catalogId, gx, gy, rotation)) return false;
    const def = FURNITURE_CATALOG.find(f => f.id === catalogId);
    const { w, d } = getFurnitureDimensions(def, rotation);
    const uid = Math.random().toString(36).slice(2, 9);
    const item = { uid, catalogId, gx, gy, w, d, rotation };
    state.furnitures.push(item);

    const meshGroup = createFurniture3DModel(catalogId, w, d, rotation);
    const pos = gridToWorld(gx, gy, w, d);
    meshGroup.position.set(pos.x, 0, pos.z);
    meshGroup.userData = { uid, catalogId };
    furnitureGroup.add(meshGroup);
    furnitureMeshes.set(uid, meshGroup);
    return true;
}

function removeFurnitureByUid(uid) {
    const mesh = furnitureMeshes.get(uid);
    if (mesh) {
        furnitureGroup.remove(mesh);
        furnitureMeshes.delete(uid);
    }
    state.furnitures = state.furnitures.filter(f => f.uid !== uid);
}

function getFurnitureAt(gx, gy, includeRug = true) {
    for (let i = state.furnitures.length - 1; i >= 0; i--) {
        const f = state.furnitures[i];
        const def = FURNITURE_CATALOG.find(c => c.id === f.catalogId);
        if (!includeRug && def.category === 'floor_decor') continue;
        if (gx >= f.gx && gx < f.gx + f.w && gy >= f.gy && gy < f.gy + f.d) {
            return { instance: f, def };
        }
    }
    return null;
}

function isTileWalkable(gx, gy) {
    if (gx < 0 || gx >= GRID_SIZE || gy < 0 || gy >= GRID_SIZE) return false;
    const hit = getFurnitureAt(gx, gy, false);
    if (hit && hit.def.solid) return false;
    return true;
}

function findPath(startX, startY, goalX, goalY) {
    if (startX === goalX && startY === goalY) return [];
    if (!isTileWalkable(goalX, goalY)) return [];

    const openSet = [{ x: startX, y: startY, g: 0, h: Math.abs(goalX - startX) + Math.abs(goalY - startY), parent: null }];
    const closedSet = new Set();
    const dirs = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];

    while (openSet.length > 0) {
        openSet.sort((a, b) => (a.g + a.h) - (b.g + b.h));
        const curr = openSet.shift();
        const key = `${curr.x},${curr.y}`;
        if (curr.x === goalX && curr.y === goalY) {
            const path = [];
            let node = curr;
            while (node.parent) {
                path.unshift({ gx: node.x, gy: node.y });
                node = node.parent;
            }
            return path;
        }
        closedSet.add(key);
        for (const d of dirs) {
            const nx = curr.x + d.dx;
            const ny = curr.y + d.dy;
            if (closedSet.has(`${nx},${ny}`) || !isTileWalkable(nx, ny)) continue;
            const g = curr.g + 1;
            const ex = openSet.find(n => n.x === nx && n.y === ny);
            if (!ex) {
                openSet.push({ x: nx, y: ny, g, h: Math.abs(goalX - nx) + Math.abs(goalY - ny), parent: curr });
            } else if (g < ex.g) {
                ex.g = g;
                ex.parent = curr;
            }
        }
    }
    return [];
}

// Web Audio API プロシージャル Lo-Fi チルコードシンセ（外部音声ファイル不要）
// ============================================================================
let audioCtx = null;
let musicInterval = null;

function toggleLoFiAudio() {
    state.musicPlaying = !state.musicPlaying;
    const icon = document.getElementById('audioIcon');
    const btn = document.getElementById('btnAudio');

    if (state.musicPlaying) {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        icon.textContent = '🎵';
        btn.classList.add('ps5-btn-active');

        // 温かいジャズ/Lo-Fiテンションコード進行 (Fmaj7 -> Em7 -> Dm7 -> Cmaj7)
        const chords = [
            [174.61, 220.00, 261.63, 329.63],
            [164.81, 196.00, 246.94, 293.66],
            [146.83, 174.61, 220.00, 261.63],
            [130.81, 164.81, 196.00, 246.94]
        ];
        let step = 0;
        const playChord = () => {
            if (!state.musicPlaying || !audioCtx) return;
            const now = audioCtx.currentTime;
            const freqs = chords[step % chords.length];
            step++;
            freqs.forEach(f => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(0.032, now + 0.35);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + 2.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 2.5);
            });
        };
        playChord();
        musicInterval = setInterval(playChord, 2600);
    } else {
        icon.textContent = '🔇';
        btn.classList.remove('ps5-btn-active');
        if (musicInterval) clearInterval(musicInterval);
    }
}

// ============================================================================
// レイキャスティング＆マウス/タッチ操作
// ============================================================================
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
let isDraggingOrbit = false;
let prevPointer = { x: 0, y: 0 };
let pointerDragDist = 0;

function updatePointerNDC(clientX, clientY) {
    pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
    pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
}

function getHoveredGridTile() {
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(floorMesh);
    if (hits.length > 0) {
        return worldToGrid(hits[0].point.x, hits[0].point.z);
    }
    return null;
}

renderer.domElement.addEventListener('pointerdown', (e) => {
    isDraggingOrbit = true;
    pointerDragDist = 0;
    prevPointer = { x: e.clientX, y: e.clientY };
});

window.addEventListener('pointermove', (e) => {
    updatePointerNDC(e.clientX, e.clientY);

    if (isDraggingOrbit) {
        const dx = e.clientX - prevPointer.x;
        const dy = e.clientY - prevPointer.y;
        pointerDragDist += Math.hypot(dx, dy);
        prevPointer = { x: e.clientX, y: e.clientY };

        if (pointerDragDist > 5) {
            camControl.desiredYaw -= dx * 0.0065;
            camControl.desiredPitch = Math.max(0.18, Math.min(1.25, camControl.desiredPitch + dy * 0.0055));
        }
    }

    const tile = getHoveredGridTile();
    state.hoverTile = tile;
    if (tile) {
        const wPos = gridToWorld(tile.gx, tile.gy, 1, 1);
        floorReticle.visible = true;
        floorReticle.position.set(wPos.x, 0.025, wPos.z);

        if (state.editMode) {
            if (state.deleteMode) {
                reticleMat.color.setHex(0xf43f5e);
            } else {
                const valid = canPlaceFurniture(state.selectedCatalogId, tile.gx, tile.gy, state.placementRotation);
                reticleMat.color.setHex(valid ? 0x10b981 : 0xef4444);
            }
        } else {
            reticleMat.color.setHex(isTileWalkable(tile.gx, tile.gy) ? 0xfbbf24 : 0xef4444);
        }
        if (state.debugMode) {
            document.getElementById('dbgHover').textContent = `(${tile.gx}, ${tile.gy})`;
        }
    } else {
        floorReticle.visible = false;
    }
});

window.addEventListener('pointerup', (e) => {
    isDraggingOrbit = false;
    if (pointerDragDist > 6) return; // カメラ回転ドラッグ時はクリック判定しない

    updatePointerNDC(e.clientX, e.clientY);
    const tile = getHoveredGridTile();
    if (!tile) return;

    if (state.editMode) {
        if (state.deleteMode) {
            const hit = getFurnitureAt(tile.gx, tile.gy, true);
            if (hit) removeFurnitureByUid(hit.instance.uid);
        } else {
            placeFurniture(state.selectedCatalogId, tile.gx, tile.gy, state.placementRotation);
        }
        return;
    }

    // 通常プレイ：クリックした家具のインタラクションまたは床へのA*移動
    const clickedFurn = getFurnitureAt(tile.gx, tile.gy, false);
    if (clickedFurn && clickedFurn.def.interactive) {
        if (clickedFurn.def.interactive === 'music') {
            toggleLoFiAudio();
            showSpeechBubble(state.musicPlaying ? '🎵 レコードを再生したよ！' : 'レコードを止めたよ');
            return;
        } else if (clickedFurn.def.interactive === 'light') {
            const order = ['sunset', 'rain', 'morning'];
            const next = order[(order.indexOf(state.lightingPreset) + 1) % order.length];
            applyLightingPreset(next);
            updateLightButtonsUI();
            return;
        } else if (clickedFurn.def.interactive === 'tv') {
            toggleLoFiAudio();
            showSpeechBubble('📺 4Kシアター＆サウンドON！');
            return;
        }
    }

    if (isTileWalkable(tile.gx, tile.gy)) {
        avatar.pendingSit = !!(clickedFurn && clickedFurn.def.sittable);
        if (avatar.gx === tile.gx && avatar.gy === tile.gy) {
            if (avatar.pendingSit) triggerAction('sit');
            return;
        }
        const path = findPath(avatar.gx, avatar.gy, tile.gx, tile.gy);
        if (path.length > 0) {
            avatar.path = path;
        }
    }
});

function triggerAction(type) {
    avatar.path = [];
    if (type === 'sit') {
        avatar.action = 'sit';
        const f = getFurnitureAt(avatar.gx, avatar.gy, false);
        avatar.seatY = (f && f.def.seatY) ? f.def.seatY - 0.22 : 0.05;
        if (f && f.instance) {
            avatar.rotY = f.instance.rotation % 2 === 0 ? 0 : Math.PI / 2;
        }
    } else if (type === 'wave') {
        avatar.seatY = 0;
        avatar.action = 'wave';
        avatar.actionTimer = 1.6;
    } else if (type === 'jump') {
        avatar.seatY = 0;
        avatar.action = 'jump';
        avatar.actionTimer = 0.55;
    }
}

function showSpeechBubble(text) {
    const t = text.trim();
    if (!t) return;
    state.chatBubble = { text: t, expiresAt: performance.now() + 5200 };
    renderOverlayDOM();
}

function showEmote(symbol) {
    state.emotePop = { symbol, expiresAt: performance.now() + 2600 };
    renderOverlayDOM();
}

function renderOverlayDOM() {
    overlayLayer.innerHTML = '';
    const now = performance.now();
    if (state.chatBubble && state.chatBubble.expiresAt > now) {
        const div = document.createElement('div');
        div.id = 'activeSpeechBubble';
        div.className = 'speech-bubble-3d';
        div.textContent = state.chatBubble.text;
        overlayLayer.appendChild(div);
    }
    if (state.emotePop && state.emotePop.expiresAt > now) {
        const badge = document.createElement('div');
        badge.id = 'activeEmoteBadge';
        badge.className = 'absolute -translate-x-1/2 -translate-y-full ps5-glass rounded-full px-3 py-1 font-extrabold text-base text-amber-300 shadow-lg animate-bounce';
        badge.textContent = state.emotePop.symbol;
        overlayLayer.appendChild(badge);
    }
}

function projectHeadToScreen() {
    const headWorld = new THREE.Vector3(avatarRig.position.x, avatarRig.position.y + 1.65, avatarRig.position.z);
    headWorld.project(camera);
    return {
        x: (headWorld.x * 0.5 + 0.5) * window.innerWidth,
        y: (-headWorld.y * 0.5 + 0.5) * window.innerHeight
    };
}

// ============================================================================
// メインアニメーションループ
// ============================================================================
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    const elapsed = clock.getElapsedTime();

    // 1. シネマモード時の自動カメラドリフト
    if (state.cameraPreset === 'cinema' && !isDraggingOrbit) {
        camControl.desiredYaw = Math.PI * 0.22 + Math.sin(elapsed * 0.25) * 0.16;
    }

    // 2. カメラの滑らかなダンピング補間
    camControl.yaw += (camControl.desiredYaw - camControl.yaw) * 0.1;
    camControl.pitch += (camControl.desiredPitch - camControl.pitch) * 0.1;
    camControl.distance += (camControl.desiredDistance - camControl.distance) * 0.1;
    camControl.target.lerp(camControl.desiredTarget, 0.1);

    camera.position.x = camControl.target.x + camControl.distance * Math.sin(camControl.yaw) * Math.cos(camControl.pitch);
    camera.position.y = camControl.target.y + camControl.distance * Math.sin(camControl.pitch);
    camera.position.z = camControl.target.z + camControl.distance * Math.cos(camControl.yaw) * Math.cos(camControl.pitch);
    camera.lookAt(camControl.target);

    // 3. アバター移動＆関節アニメーション更新
    const { leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot } = avatarRig.userData.limbs;
    let jumpOffsetY = 0;

    if (avatar.path.length > 0) {
        avatar.action = 'walk';
        avatar.seatY = 0;
        const next = avatar.path[0];
        const dx = next.gx - avatar.visualX;
        const dy = next.gy - avatar.visualY;
        const dist = Math.hypot(dx, dy);

        avatar.rotY = Math.atan2(dx, dy);
        const step = avatar.moveSpeed * dt;

        if (dist <= step) {
            avatar.visualX = next.gx;
            avatar.visualY = next.gy;
            avatar.gx = next.gx;
            avatar.gy = next.gy;
            avatar.path.shift();

            if (avatar.path.length === 0) {
                const furn = getFurnitureAt(avatar.gx, avatar.gy, false);
                if (avatar.pendingSit || (furn && furn.def.sittable)) {
                    triggerAction('sit');
                    avatar.pendingSit = false;
                } else {
                    avatar.action = 'idle';
                }
            }
        } else {
            avatar.visualX += (dx / dist) * step;
            avatar.visualY += (dy / dist) * step;
            avatar.walkPhase += dt * 13;
        }

        // 歩行スイング
        const swing = Math.sin(avatar.walkPhase) * 0.65;
        leftLegPivot.rotation.x = swing;
        rightLegPivot.rotation.x = -swing;
        leftArmPivot.rotation.x = -swing * 0.75;
        rightArmPivot.rotation.x = swing * 0.75;
        jumpOffsetY = Math.abs(Math.sin(avatar.walkPhase)) * 0.06;
    } else if (avatar.action === 'sit') {
        leftLegPivot.rotation.x = -Math.PI / 2.2;
        rightLegPivot.rotation.x = -Math.PI / 2.2;
        leftArmPivot.rotation.x = -0.25;
        rightArmPivot.rotation.x = -0.25;
    } else if (avatar.action === 'wave') {
        avatar.actionTimer -= dt;
        leftLegPivot.rotation.x = 0;
        rightLegPivot.rotation.x = 0;
        rightArmPivot.rotation.z = 2.6 + Math.sin(elapsed * 14) * 0.35;
        if (avatar.actionTimer <= 0) {
            rightArmPivot.rotation.z = 0;
            avatar.action = 'idle';
        }
    } else if (avatar.action === 'jump') {
        avatar.actionTimer -= dt;
        jumpOffsetY = Math.sin((1 - avatar.actionTimer / 0.55) * Math.PI) * 0.65;
        leftArmPivot.rotation.z = -0.6;
        rightArmPivot.rotation.z = 0.6;
        if (avatar.actionTimer <= 0) {
            leftArmPivot.rotation.z = 0;
            rightArmPivot.rotation.z = 0;
            avatar.action = 'idle';
        }
    } else {
        // 待機呼吸モーション
        leftLegPivot.rotation.x *= 0.85;
        rightLegPivot.rotation.x *= 0.85;
        leftArmPivot.rotation.x *= 0.85;
        rightArmPivot.rotation.x *= 0.85;
        jumpOffsetY = Math.sin(elapsed * 2.5) * 0.015;
    }

    const wPos = gridToWorld(avatar.visualX, avatar.visualY, 1, 1);
    avatarRig.position.set(wPos.x, avatar.seatY + jumpOffsetY, wPos.z);
    avatarRig.rotation.y = avatar.rotY;

    // 4. 環境アニメーション（ホコリ粒子・雨粒・レコード回転・TV発光）
    const dArr = dustGeo.attributes.position.array;
    for (let i = 0; i < dustCount; i++) {
        dArr[i * 3 + 1] += Math.sin(elapsed + i) * 0.0012;
    }
    dustGeo.attributes.position.needsUpdate = true;

    if (state.lightingPreset === 'rain') {
        const rArr = rainGeo.attributes.position.array;
        for (let i = 0; i < rainCount; i++) {
            rArr[i * 3 + 1] -= dt * 14;
            if (rArr[i * 3 + 1] < -2) rArr[i * 3 + 1] = 8;
        }
        rainGeo.attributes.position.needsUpdate = true;
    }

    if (vinylDiscMesh && state.musicPlaying) {
        vinylDiscMesh.rotation.y += dt * 3.5;
        speakerCones.forEach((c, idx) => {
            const pulse = 1 + Math.sin(elapsed * 12 + idx) * 0.08;
            c.scale.set(pulse, 1, pulse);
        });
    }

    if (tvScreenMesh) {
        const hue = (elapsed * 0.04) % 1;
        tvScreenMesh.material.emissive.setHSL(hue, 0.75, 0.45);
        tvGlowLight.color.setHSL(hue, 0.8, 0.55);
    }

    // 5. 吹き出しHUD位置同期＆デバッグ情報更新
    const screenHead = projectHeadToScreen();
    const now = performance.now();
    const bubbleEl = document.getElementById('activeSpeechBubble');
    if (bubbleEl) {
        if (!state.chatBubble || state.chatBubble.expiresAt <= now) {
            bubbleEl.remove();
            state.chatBubble = null;
        } else {
            bubbleEl.style.left = `${screenHead.x}px`;
            bubbleEl.style.top = `${screenHead.y - 10}px`;
        }
    }
    const emoteEl = document.getElementById('activeEmoteBadge');
    if (emoteEl) {
        if (!state.emotePop || state.emotePop.expiresAt <= now) {
            emoteEl.remove();
            state.emotePop = null;
        } else {
            emoteEl.style.left = `${screenHead.x}px`;
            emoteEl.style.top = `${screenHead.y - (bubbleEl ? 58 : 10)}px`;
        }
    }

    if (state.debugMode) {
        document.getElementById('dbgAvatar').textContent = `(${avatar.gx}, ${avatar.gy}) [${avatar.action}]`;
        document.getElementById('dbgCalls').textContent = renderer.info.render.calls;
        document.getElementById('dbgTris').textContent = renderer.info.render.triangles;
    }

    renderer.render(scene, camera);
}

<style>
    body.app-compact header,
    body.app-compact footer,
    body.app-compact #debugPanel,
    body.app-compact #editControls { display: none !important; }
</style>
<script>
(function () {
    let wanderOn = true;
    const roles = new Map();

    // アバターの素材を、元の色で「肌・髪・服…」に分類しておく
    function tagMaterials() {
        avatarRig.traverse(o => {
            if (!o.isMesh || roles.has(o.material)) return;
            const hex = o.material.color.getHex();
            let role = null;
            if (o.material.isMeshBasicMaterial) role = 'eye';
            else if (hex === 0xfed7aa) role = 'skin';
            else if (hex === 0x18181b) role = 'hair';
            else if (hex === 0xb91c1c) role = 'top';
            else if (hex === 0x0f172a) role = 'vest';
            else if (hex === 0x1e293b) role = 'pants';
            else if (hex === 0xdc2626) role = 'shoes';
            roles.set(o.material, { role, mesh: o });
        });
    }

    // ===================================================================
    // リアル寄りの人型アバター（肌・体格・髪型・服などを自由に変えられる）
    // ===================================================================
    const AGE = {
        baby:  { leg: 0.30, torso: 0.30, headR: 0.135, thick: 1.25, shoulder: 0.11, neck: 0.025 },
        kid:   { leg: 0.62, torso: 0.38, headR: 0.128, thick: 0.85, shoulder: 0.15, neck: 0.05 },
        teen:  { leg: 0.84, torso: 0.47, headR: 0.123, thick: 0.92, shoulder: 0.18, neck: 0.07 },
        adult: { leg: 0.90, torso: 0.50, headR: 0.121, thick: 1.00, shoulder: 0.20, neck: 0.08 }
    };
    const BUILD = {
        slim:   { w: 0.85, l: 0.85 },
        normal: { w: 1.00, l: 1.00 },
        muscle: { w: 1.15, l: 1.22 },
        chubby: { w: 1.30, l: 1.18 }
    };
    let eyeGroups = [];
    let currentScale = 1;

    function mat(color, opts) {
        return new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.7 }, opts || {}));
    }
    function add(geo, m, parent, x, y, z) {
        const o = new THREE.Mesh(geo, m);
        o.position.set(x || 0, y || 0, z || 0);
        o.castShadow = true;
        o.receiveShadow = true;
        parent.add(o);
        return o;
    }

    function buildHuman(look) {
        while (avatarRig.children.length) avatarRig.remove(avatarRig.children[0]);
        eyeGroups = [];
        const stage = look.stage || 'adult';
        const A = AGE[stage] || AGE.adult;
        const B = BUILD[look.build] || BUILD.normal;
        const isBaby = stage === 'baby';
        const isKid = stage === 'kid';
        const grown = stage === 'teen' || stage === 'adult';
        const lt = A.thick * B.l;

        const skin = mat(look.skin || '#d69a6b', { roughness: 0.52 });
        const hairM = mat(look.hairColor || '#1e1a18', { roughness: 0.85 });
        const hairSoft = mat(look.hairColor || '#1e1a18', { roughness: 0.9, transparent: true, opacity: 0.55 });
        const hairBack = mat(look.hairColor || '#1e1a18', { roughness: 0.85, side: THREE.DoubleSide });
        const topM = mat(look.topColor || '#d7263d', { roughness: 0.88 });
        const topDark = topM.clone(); topDark.color.multiplyScalar(0.65);
        const pantsM = mat('#2b3a55', { roughness: 0.92 });
        const diaperM = mat('#f4f4f4', { roughness: 0.9 });
        const shoeM = mat('#f2f2f2', { roughness: 0.45 });
        const soleM = mat('#1f1f1f', { roughness: 0.6 });
        const lipM = mat('#a85a52', { roughness: 0.45 });
        const whiteM = mat('#f7f7f5', { roughness: 0.2 });
        const irisM = mat('#3a2414', { roughness: 0.1 });
        const pupilM = mat('#050505', { roughness: 0.05 });
        const hatM = mat(look.hatColor || '#1c1c1e', { roughness: 0.8 });
        const hatDark = hatM.clone(); hatDark.color.multiplyScalar(0.7);
        const metal = mat(look.chain === 'silver' ? '#d0d4da' : '#f4c430', { metalness: 1, roughness: 0.28 });
        const blackM = mat('#111111', { metalness: 0.5, roughness: 0.2 });
        const cheekM = mat('#ff8a8a', { transparent: true, opacity: 0.18, roughness: 0.6 });

        const hipY = A.leg + 0.02;
        const T = A.torso;
        const torsoBase = hipY - 0.04;
        const sleeveLong = look.top === 'hoodie' || look.top === 'jacket';
        const sleeveless = look.top === 'jersey';
        const limbs = {};

        // ---- 脚 ----
        [-1, 1].forEach(side => {
            const pivot = new THREE.Group();
            pivot.position.set(side * 0.085 * B.w * (isBaby ? 1.1 : 1), hipY, 0);
            avatarRig.add(pivot);
            const thighL = A.leg * 0.5, shinL = A.leg * 0.47;
            const legM = isBaby ? skin : pantsM;
            add(new THREE.CylinderGeometry(0.068 * lt, 0.055 * lt, thighL, 16), legM, pivot, 0, -thighL / 2, 0);
            add(new THREE.SphereGeometry(0.055 * lt, 14, 10), legM, pivot, 0, -thighL, 0);
            add(new THREE.CylinderGeometry(0.053 * lt, 0.042 * lt, shinL, 16), legM, pivot, 0, -thighL - shinL / 2, 0);
            const footY = -A.leg + 0.035;
            if (isBaby) {
                const foot = add(new THREE.SphereGeometry(0.045, 14, 10), skin, pivot, 0, footY, 0.03);
                foot.scale.set(1, 0.6, 1.5);
            } else {
                add(new THREE.BoxGeometry(0.1 * Math.min(lt, 1.2), 0.065, 0.23), shoeM, pivot, 0, footY, 0.04);
                add(new THREE.BoxGeometry(0.106 * Math.min(lt, 1.2), 0.022, 0.24), soleM, pivot, 0, footY - 0.04, 0.04);
            }
            limbs[side < 0 ? 'leftLegPivot' : 'rightLegPivot'] = pivot;
        });

        // ---- 胴体（肩・腰のくびれのある形）----
        const profile = [[0.13, 0], [0.15, 0.06], [0.135, 0.3], [0.145, 0.55], [0.175, 0.78], [0.18, 0.88], [0.14, 0.95], [0.06, 1.0]]
            .map(p => new THREE.Vector2(p[0], p[1] * T));
        const torso = add(new THREE.LatheGeometry(profile, 32), look.top === 'jacket' ? topDark : topM, avatarRig, 0, torsoBase, 0);
        torso.scale.set(B.w * (isBaby ? 1.15 : 1), 1, 0.72 * (look.build === 'chubby' ? 1.2 : 1));

        // 腰まわり（ズボン／おむつ）
        const hips = add(new THREE.CylinderGeometry(0.152, 0.142, 0.15, 28), isBaby ? diaperM : pantsM, avatarRig, 0, hipY + 0.01, 0);
        hips.scale.set(B.w * (isBaby ? 1.2 : 1), 1, 0.74 * (look.build === 'chubby' ? 1.2 : 1));

        if (look.build === 'chubby' || isBaby) {
            const belly = add(new THREE.SphereGeometry(0.14, 24, 18), topM, avatarRig, 0, torsoBase + T * 0.38, 0.045);
            belly.scale.set(1.05 * B.w, 1, 0.8);
        }
        if (look.build === 'muscle' && grown) {
            [-1, 1].forEach(side => {
                const pec = add(new THREE.SphereGeometry(0.075, 18, 14), topM, avatarRig, side * 0.07, torsoBase + T * 0.76, 0.095);
                pec.scale.set(1.15, 0.8, 0.6);
            });
        }
        if (look.top === 'jacket') {
            add(new THREE.BoxGeometry(0.09, T * 0.62, 0.02), whiteM, avatarRig, 0, torsoBase + T * 0.6, 0.11 * (look.build === 'chubby' ? 1.2 : 1));
        }
        if (look.top === 'hoodie') {
            const hood = add(new THREE.TorusGeometry(0.095, 0.038, 12, 24), topM, avatarRig, 0, torsoBase + T * 0.97, -0.035);
            hood.rotation.x = Math.PI / 2.3;
            [-1, 1].forEach(side => add(new THREE.CylinderGeometry(0.004, 0.004, T * 0.3, 6), whiteM, avatarRig, side * 0.03, torsoBase + T * 0.78, 0.13));
        }

        // ---- 首 ----
        add(new THREE.CylinderGeometry(0.048, 0.055, A.neck + 0.06, 16), skin, avatarRig, 0, torsoBase + T + A.neck / 2 - 0.01, 0);

        // ---- 腕 ----
        const shoulderY = torsoBase + T * 0.88;
        [-1, 1].forEach(side => {
            const pivot = new THREE.Group();
            pivot.position.set(side * (A.shoulder * B.w * 0.86 + 0.028 * lt), shoulderY, 0);
            avatarRig.add(pivot);
            const upL = T * 0.62, foreL = T * 0.56;
            const upM = sleeveless ? skin : topM;
            const foreM = sleeveLong ? topM : skin;
            add(new THREE.SphereGeometry(0.05 * lt, 14, 10), upM, pivot, 0, 0, 0);
            add(new THREE.CylinderGeometry(0.052 * lt, 0.044 * lt, upL, 14), upM, pivot, 0, -upL / 2, 0);
            add(new THREE.SphereGeometry(0.044 * lt, 14, 10), foreM, pivot, 0, -upL, 0);
            add(new THREE.CylinderGeometry(0.042 * lt, 0.034 * lt, foreL, 14), foreM, pivot, 0, -upL - foreL / 2, 0);
            const hand = add(new THREE.SphereGeometry(0.04 * Math.min(lt, 1.15), 14, 10), skin, pivot, 0, -upL - foreL - 0.03, 0.005);
            hand.scale.set(0.8, 1.2, 0.55);
            limbs[side < 0 ? 'leftArmPivot' : 'rightArmPivot'] = pivot;
        });

        // ---- 頭 ----
        const R = A.headR;
        const headY = torsoBase + T + A.neck + R * 1.05;
        const headGroup = new THREE.Group();
        headGroup.position.y = headY;
        avatarRig.add(headGroup);
        const skull = new THREE.Group();
        skull.scale.set(0.9, 1.08, 0.98);
        headGroup.add(skull);
        add(new THREE.SphereGeometry(R, 40, 28), skin, skull);
        if (!isBaby) {
            const jaw = add(new THREE.SphereGeometry(R * 0.8, 28, 18), skin, skull, 0, -R * 0.36, R * 0.1);
            jaw.scale.set(grown ? 0.95 : 0.9, 0.78, 0.9);
        }
        if (isBaby || isKid) {
            [-1, 1].forEach(side => {
                const ch = add(new THREE.SphereGeometry(R * 0.3, 16, 12), skin, skull, side * R * 0.52, -R * 0.28, R * 0.62);
                ch.scale.set(1, 0.85, 0.8);
                add(new THREE.SphereGeometry(R * 0.22, 14, 10), cheekM, skull, side * R * 0.55, -R * 0.22, R * 0.78);
            });
        }
        // 耳
        [-1, 1].forEach(side => {
            const ear = add(new THREE.SphereGeometry(R * 0.25, 16, 12), skin, skull, side * R * 0.95, -R * 0.05, -R * 0.02);
            ear.scale.set(0.42, 1, 0.75);
            if (look.earring && side < 0) add(new THREE.SphereGeometry(R * 0.06, 10, 8), metal, skull, side * R * 1.0, -R * 0.3, 0);
        });
        // 鼻
        const nose = add(new THREE.SphereGeometry(R * (isBaby ? 0.13 : 0.16), 16, 12), skin, skull, 0, -R * 0.12, R * 0.97);
        nose.scale.set(0.75, isBaby ? 0.8 : 1.05, 0.9);
        // 目
        const eyeS = isBaby ? 1.18 : (isKid ? 1.1 : 1);
        [-1, 1].forEach(side => {
            const eg = new THREE.Group();
            eg.position.set(side * R * 0.36, R * 0.08, R * 0.82);
            skull.add(eg);
            add(new THREE.SphereGeometry(R * 0.15 * eyeS, 18, 14), whiteM, eg);
            const iris = add(new THREE.SphereGeometry(R * 0.098 * eyeS, 16, 12), irisM, eg, 0, 0, R * 0.075 * eyeS);
            iris.scale.set(1, 1, 0.6);
            add(new THREE.SphereGeometry(R * 0.05 * eyeS, 12, 10), pupilM, eg, 0, 0, R * 0.12 * eyeS);
            add(new THREE.SphereGeometry(R * 0.018 * eyeS, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }), eg, R * 0.03, R * 0.03, R * 0.15 * eyeS);
            // まぶた（上半分を肌でおおう）
            const lid = add(new THREE.SphereGeometry(R * 0.158 * eyeS, 18, 10, 0, Math.PI * 2, 0, Math.PI * (look.eyes === 'sleepy' ? 0.5 : 0.36)), skin, eg);
            lid.rotation.x = -0.2;
            eyeGroups.push(eg);
            // まゆげ
            const browH = look.brows === 'thick' ? 0.1 : (look.brows === 'angry' ? 0.075 : 0.05);
            const brow = add(new THREE.BoxGeometry(R * 0.34, R * browH, R * 0.06), isBaby ? skin : hairM, skull, side * R * 0.37, R * 0.32, R * 0.9);
            brow.rotation.z = look.brows === 'angry' ? -side * 0.3 : side * 0.06;
            if (look.eyes === 'sharp') eg.rotation.z = -side * 0.12;
        });
        // 口
        const mouthY = -R * (isBaby ? 0.4 : 0.42);
        if (look.mouth === 'smile' || look.mouth === 'grin') {
            const arc = add(new THREE.TorusGeometry(R * (look.mouth === 'grin' ? 0.24 : 0.19), R * 0.032, 8, 20, Math.PI * 0.8), lipM, skull, 0, mouthY + R * 0.1, R * 0.86);
            arc.rotation.z = Math.PI * 1.1;
            if (look.mouth === 'grin') add(new THREE.BoxGeometry(R * 0.3, R * 0.07, R * 0.03), whiteM, skull, 0, mouthY - R * 0.03, R * 0.9);
        } else {
            const lip = add(new THREE.BoxGeometry(R * (isBaby ? 0.2 : 0.34), R * 0.05, R * 0.05), lipM, skull, look.mouth === 'smirk' ? R * 0.05 : 0, mouthY, R * 0.9);
            if (look.mouth === 'smirk') lip.rotation.z = 0.18;
        }

        // ---- 髪 ----
        function cap(r, theta, m, tilt) {
            const o = add(new THREE.SphereGeometry(r, 36, 18, 0, Math.PI * 2, 0, theta), m, skull);
            o.rotation.x = tilt === undefined ? -0.35 : tilt;
            return o;
        }
        const hs = look.hairStyle || 'short';
        if (isBaby) {
            if (hs !== 'bald') {
                cap(R * 1.015, Math.PI * 0.33, hairSoft);
                const tuft = add(new THREE.ConeGeometry(R * 0.07, R * 0.3, 8), hairM, skull, 0, R * 1.08, 0);
                tuft.rotation.z = 0.3;
            }
        } else if (hs === 'buzz') {
            cap(R * 1.012, Math.PI * 0.43, hairSoft);
        } else if (hs === 'short') {
            cap(R * 1.05, Math.PI * 0.45, hairM);
            const fringe = add(new THREE.SphereGeometry(R * 0.5, 20, 14), hairM, skull, R * 0.15, R * 0.68, R * 0.55);
            fringe.scale.set(1.3, 0.42, 0.8);
        } else if (hs === 'afro') {
            add(new THREE.SphereGeometry(R * 1.55, 32, 24), hairM, skull, 0, R * 0.38, -R * 0.2);
        } else if (hs === 'long') {
            cap(R * 1.05, Math.PI * 0.5, hairM);
            add(new THREE.CylinderGeometry(R * 1.03, R * 1.22, R * 2.4, 28, 1, true, Math.PI / 2, Math.PI), hairBack, skull, 0, -R * 0.75, -R * 0.05);
        } else if (hs === 'braids') {
            cap(R * 1.03, Math.PI * 0.47, hairM);
            for (let i = 0; i < 11; i++) {
                const phi = Math.PI * (i / 10);
                add(new THREE.CylinderGeometry(R * 0.065, R * 0.05, R * 2.1, 8), hairM, skull,
                    -Math.cos(phi) * R * 0.98, -R * 0.55, -Math.sin(phi) * R * 0.9);
            }
        } else if (hs === 'mohawk') {
            cap(R * 1.008, Math.PI * 0.4, hairSoft);
            for (let i = 0; i < 7; i++) {
                const t = -0.7 + i * 0.27;
                const fin = add(new THREE.BoxGeometry(R * 0.14, R * 0.42, R * 0.3), hairM, skull, 0, Math.cos(t) * R * 1.05, Math.sin(t) * R * 1.05);
                fin.rotation.x = t;
            }
        }

        // ---- ひげ ----
        if (grown && look.beard && look.beard !== 'none') {
            if (look.beard === 'goatee') {
                const g = add(new THREE.SphereGeometry(R * 0.2, 16, 12), hairM, skull, 0, -R * 0.66, R * 0.8);
                g.scale.set(1, 1.15, 0.6);
                add(new THREE.BoxGeometry(R * 0.42, R * 0.07, R * 0.08), hairM, skull, 0, -R * 0.3, R * 0.93);
            } else {
                const bm = look.beard === 'stubble' ? hairSoft : hairM;
                const beard = add(new THREE.SphereGeometry(R * 1.04, 32, 14, 0, Math.PI, Math.PI * 0.55, Math.PI * 0.38), bm, skull, 0, -R * 0.05, 0);
                beard.material = bm.clone();
                beard.material.side = THREE.DoubleSide;
            }
        }

        // ---- 帽子 ----
        if (look.hat === 'cap') {
            cap(R * 1.1, Math.PI * 0.42, hatM, -0.15);
            const brim = add(new THREE.CylinderGeometry(R * 0.78, R * 0.78, R * 0.05, 28, 1, false, -Math.PI / 2, Math.PI), hatDark, skull, 0, R * 0.42, R * 0.55);
            brim.rotation.x = 0.18;
        } else if (look.hat === 'beanie') {
            const b = cap(R * 1.1, Math.PI * 0.48, hatM, -0.2);
            b.scale.y = 1.12;
            const band = add(new THREE.TorusGeometry(R * 1.02, R * 0.1, 10, 36), hatDark, skull, 0, R * 0.12, -R * 0.05);
            band.rotation.x = Math.PI / 2 + 0.2;
        } else if (look.hat === 'bucket') {
            add(new THREE.CylinderGeometry(R * 0.85, R * 1.0, R * 0.6, 28), hatM, skull, 0, R * 0.78, 0);
            add(new THREE.CylinderGeometry(R * 1.45, R * 1.45, R * 0.05, 36), hatDark, skull, 0, R * 0.47, 0);
        }

        // ---- メガネ ----
        if (look.glasses === 'round') {
            [-1, 1].forEach(side => add(new THREE.TorusGeometry(R * 0.18, R * 0.016, 8, 24), blackM, skull, side * R * 0.36, R * 0.08, R * 0.99));
            add(new THREE.CylinderGeometry(R * 0.012, R * 0.012, R * 0.36, 6), blackM, skull, 0, R * 0.1, R * 1.0).rotation.z = Math.PI / 2;
        } else if (look.glasses === 'shades') {
            [-1, 1].forEach(side => add(new THREE.BoxGeometry(R * 0.36, R * 0.22, R * 0.03), blackM, skull, side * R * 0.37, R * 0.08, R * 0.98));
            add(new THREE.BoxGeometry(R * 0.4, R * 0.04, R * 0.03), blackM, skull, 0, R * 0.14, R * 0.99);
        }

        // ---- チェーン ----
        if (look.chain && look.chain !== 'none' && !isBaby) {
            const chain = add(new THREE.TorusGeometry(0.085 * B.w, 0.007, 8, 40), metal, avatarRig, 0, torsoBase + T * 0.93, 0.035);
            chain.rotation.x = Math.PI / 2 - 0.45;
            add(new THREE.SphereGeometry(0.02, 12, 10), metal, avatarRig, 0, torsoBase + T * 0.83, 0.12);
        }

        avatarRig.userData.limbs = limbs;
        avatarRig.userData.headGroup = headGroup;
        avatarRig.userData.hipY = hipY;
        avatarRig.userData.headTop = headY + R * 1.15;
    }

    // まばたき
    setInterval(() => {
        eyeGroups.forEach(e => { e.scale.y = 0.12; });
        setTimeout(() => eyeGroups.forEach(e => { e.scale.y = 1; }), 130);
    }, 3800);

    // ふきだしをアバターの身長に合わせる
    projectHeadToScreen = function () {
        const top = (avatarRig.userData.headTop || 1.5) * currentScale + 0.15;
        const p = new THREE.Vector3(avatarRig.position.x, avatarRig.position.y + top, avatarRig.position.z);
        p.project(camera);
        return { x: (p.x * 0.5 + 0.5) * window.innerWidth, y: (-p.y * 0.5 + 0.5) * window.innerHeight };
    };

    // 座ったときの高さを、脚の長さに合わせる
    const originalTrigger = triggerAction;
    triggerAction = function (type) {
        originalTrigger(type);
        if (type === 'sit' && avatarRig.userData.hipY) {
            avatar.seatY += 0.52 - avatarRig.userData.hipY * currentScale;
        }
    };

    function currentLayout() {
        return JSON.stringify(state.furnitures.map(f => ({
            id: f.catalogId, gx: f.gx, gy: f.gy, r: f.rotation
        })));
    }

    window.app = {
        say(t) { showSpeechBubble(t); },
        emote(s) { showEmote(s); },
        setCompact(on) {
            document.body.classList.toggle('app-compact', !!on);
            camControl.desiredDistance = on ? 19 : 14.5;
        },
        setLight(p) {
            applyLightingPreset(p);
            if (typeof updateLightButtonsUI === 'function') updateLightButtonsUI();
        },
        setLook(look) {
            buildHuman(look);
            currentScale = look.scale || 1;
            avatarRig.scale.setScalar(currentScale);
        },
        // キャラを正面から大きく映す（着せ替え用）
        setPortrait(on) {
            wanderOn = !on;
            if (!on) { setCameraPreset('iso'); return; }
            avatar.path = [];
            avatar.action = 'idle';
            avatar.seatY = 0;
            const yaw = Math.PI * 0.25;
            avatar.rotY = yaw;
            const h = (avatarRig.userData.headTop || 1.5) * currentScale;
            camControl.desiredYaw = yaw;
            camControl.desiredPitch = 0.08;
            camControl.desiredDistance = Math.max(1.3, h * 1.55);
            const w = gridToWorld(avatar.visualX, avatar.visualY, 1, 1);
            camControl.desiredTarget.set(w.x, h * 0.6, w.z);
            state.cameraPreset = 'portrait';
        },
        setLayout(list) {
            if (!Array.isArray(list)) return;
            Array.from(furnitureMeshes.keys()).forEach(uid => removeFurnitureByUid(uid));
            list.forEach(f => placeFurniture(f.id, f.gx, f.gy, f.r || 0));
            lastSent = currentLayout();
        },
        resetLayout() {
            initDefaultLoftRoom();
        },
        setWander(on) { wanderOn = !!on; }
    };

    // 家具の配置が変わったらアプリに知らせる（保存のため）
    let lastSent = '';
    setInterval(() => {
        const now = currentLayout();
        if (now === lastSent) return;
        lastSent = now;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.layout) {
            window.webkit.messageHandlers.layout.postMessage(now);
        }
    }, 1500);

    // ときどき部屋の中を勝手に歩き回る
    setInterval(() => {
        if (!wanderOn || state.editMode) return;
        if (avatar.action === 'sit') {
            if (Math.random() < 0.25) { avatar.action = 'idle'; avatar.seatY = 0; }
            return;
        }
        if (avatar.path.length > 0 || avatar.action !== 'idle') return;
        if (Math.random() < 0.3) return;
        for (let i = 0; i < 15; i++) {
            const gx = Math.floor(Math.random() * GRID_SIZE);
            const gy = Math.floor(Math.random() * GRID_SIZE);
            if (!isTileWalkable(gx, gy) || (gx === avatar.gx && gy === avatar.gy)) continue;
            const path = findPath(avatar.gx, avatar.gy, gx, gy);
            if (path.length > 0) { avatar.path = path; break; }
        }
    }, 3500);
})();
</script>
</body>
</html>
